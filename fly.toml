# Fly.io – zmień "app" na własną nazwę, potem: fly launch --no-deploy, fly volumes create ardan_data --size 1, fly deploy
app = "ardan-online"
primary_region = "waw"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/ardan.db"
  TRUST_PROXY = "1"

[mounts]
  source = "ardan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
