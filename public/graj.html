<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Graj – ARDAN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0910">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/game.css">
</head>
<body>
<canvas id="g" aria-label="ARDAN – gra MMORPG" tabindex="0"></canvas>
<aside id="chat" class="chat" aria-label="Czat">
  <div class="chat-head">
    <div class="tabs" role="tablist">
      <button type="button" data-tab="all" class="on">Wszyscy</button>
      <button type="button" data-tab="r">Kraina</button>
      <button type="button" data-tab="p">Drużyna</button>
      <button type="button" data-tab="w">Prywatne</button>
    </div>
    <button type="button" class="x" id="chatClose" aria-label="Zamknij czat">✕</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form id="chatForm" autocomplete="off">
    <select id="chan" aria-label="Kanał"><option value="g">Globalny</option><option value="r">Kraina</option><option value="p">Drużyna</option><option value="gu">Gildia</option></select>
    <input id="chatIn" maxlength="200" placeholder="Napisz… (/w nick tekst, /pomoc)" enterkeyhint="send">
    <button type="submit">➤</button>
  </form>
  <div class="chat-foot"><a href="/postacie">⟵ Zmień postać</a><span id="ping"></span></div>
</aside>
<aside id="party" class="party" aria-label="Drużyna"></aside>
<div id="overlay" class="overlay show"><div class="box"><div class="spin"></div><h2 id="ovT">Łączenie z serwerem…</h2><p id="ovP">Wczytywanie świata Ardanu.</p><div id="ovB"></div></div></div>
<script src="/js/engine.js"></script>
<script src="/js/game-ui.js"></script>
<script src="/js/game-ui2.js"></script>
<script src="/js/game-client.js"></script>
</body>
</html>
