<section class="auth-page"><div class="auth card">
<h1>Ustaw nowe hasło</h1><p class="intro">Wymyśl nowe, silne hasło. Po zmianie zostaniesz wylogowany ze wszystkich urządzeń.</p>
<form id="f" novalidate>
<div class="alert" role="alert"></div>
<div class="field"><label for="password">Nowe hasło</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required><div class="meter"><i></i></div><div class="hint" id="ph"></div></div>
<div class="field"><label for="password2">Powtórz nowe hasło</label><input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="128" required></div>
<button class="btn primary big" type="submit">Zapisz nowe hasło</button>
</form>
<p class="alt"><a href="/nie-pamietam-hasla">Poproś o nowy link</a></p>
