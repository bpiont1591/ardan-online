<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie – ARDAN</title>
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0c0910">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<header id="nav" class="nav"></header>
<main>
<section class="auth-page"><div class="auth card">
<h1>Zaloguj się</h1><p class="intro">Witaj z powrotem, bohaterze.</p>
<form id="f" novalidate>
<div class="alert" role="alert"></div>
<div class="field"><label for="login">Login lub e-mail</label><input id="login" name="login" autocomplete="username" maxlength="254" required></div>
<div class="field"><label for="password">Hasło</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></div>
<button class="btn primary big" type="submit">Zaloguj się</button>
</form>
<p class="alt"><a href="/nie-pamietam-hasla">Nie pamiętam hasła</a></p>
<p class="alt">Nie masz konta? <a href="/rejestracja">Załóż je za darmo</a></p>
</div></section>
</main>
<footer id="foot"></footer>
<script src="/js/site.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
