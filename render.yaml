# ARDAN – Render Blueprint (DARMOWY plan + darmowa baza Postgres w Neon.tech jako trwały zapis).
# Render: New > Blueprint > wybierz to repozytorium. Szczegóły: DEPLOY_PL.md
# Darmowy plan Render nie ma trwałego dysku – dlatego kopia całej bazy gry jest co 10 minut
# (i przy każdym zatrzymaniu serwera) zapisywana w Postgresie (DATABASE_URL) i odtwarzana przy starcie.
# Wersja z płatnym dyskiem (bez Postgresa): render.disk.yaml
services:
  - type: web
    name: ardan-online
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev --ignore-scripts   # better-sqlite3 ma gotowe pliki binarne (prebuilds) – nic nie trzeba kompilować
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: ./data
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL          # adres bazy z Neon.tech (postgresql://...)
        sync: false
      - key: ADMIN_LOGIN           # login pierwszego administratora
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD        # min. 8 znaków, 3 rodzaje znaków
        sync: false
      - key: SNAPSHOT_MINUTES      # co ile minut kopia do Postgresa (10 = mieści się w darmowym limicie Neon)
        value: "10"
      - key: SMTP_HOST             # opcjonalnie (reset hasła): smtp-relay.brevo.com
        sync: false
      - key: SMTP_PORT             # darmowy Render blokuje porty 25/465/587 – Brevo działa na 2525
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
